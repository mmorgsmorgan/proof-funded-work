version: '3.8'

services:
  # PostgreSQL (production database — replaces SQLite)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qit
      POSTGRES_USER: qit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (cache layer for hot reads — job listings, reputation)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Q'IT application
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - QIT_DB_PATH=/app/data/qit.sqlite
      - DATABASE_URL=postgresql://qit:${POSTGRES_PASSWORD:-changeme}@postgres:5432/qit
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_ARC_RPC=https://rpc.testnet.arc.network
      - NEXT_PUBLIC_USDC_ADDRESS=0x3600000000000000000000000000000000000000
      - NEXT_PUBLIC_ESCROW_ADDRESS=${ESCROW_ADDRESS}
      - NEXT_PUBLIC_PRIVY_APP_ID=${PRIVY_APP_ID}
      - PRIVY_APP_ID=${PRIVY_APP_ID}
      - PRIVY_APP_SECRET=${PRIVY_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - appdata:/app/data

volumes:
  pgdata:
  appdata:
